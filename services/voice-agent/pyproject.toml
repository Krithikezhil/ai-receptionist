[project]
name = "voice-agent"
version = "0.1.0"
description = "AI Receptionist voice service (FastAPI + Pipecat; no telephony transport yet — see M6)"
readme = "README.md"
authors = [
    { name = "krithikezhil", email = "krithik.e2004@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pipecat-ai[cartesia,deepgram,openai]>=1.8.1,<1.9.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
voice-agent = "voice_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pipecat-ai-small-webrtc-prebuilt>=2.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
