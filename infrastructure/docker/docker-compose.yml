# Local development data layer for AI Receptionist.
#
# M1 scope: this provisions PostgreSQL and Redis containers only. No
# application service (web/api/voice-agent) is containerized yet — those run
# natively via `npm run dev` / `uv run` in M1. Nothing in apps/api or
# services/voice-agent connects to these containers yet either; the schema
# and connection wiring arrive with M3 (organizations/business config).
#
# Usage (requires Docker):
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#
# NOT verified in this environment — Docker is not installed here. See
# DEPLOYMENT.md for the documented limitation.

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_receptionist
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
